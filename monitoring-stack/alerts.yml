groups:
  - name: fastapi_alerts
    interval: 10s
    rules:
      # critical: service is completely unreachable
      - alert: InstanceDown
        expr: up{job="fastapi-app"} == 0
        for: 30s
        labels:
          severity: critical

      # warning: error rate > 10%
      - alert: HighErrorRate
        expr: rate(app_requests_total{status="error"}[1m]) > 0.1
        for: 1m
        labels:
          severity: warning

      # warning: p95 latency > 0.5s
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(app_request_latency_seconds_bucket[1m])) > 0.5
        for: 1m
        labels:
          severity: warning